services:
  postgres_db:
    image: postgres:15-alpine
    container_name: centro_gamer_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Solo local: nunca 0.0.0.0
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-desarrollo}
    container_name: centro_gamer_api
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # Dentro de la red, el host es el nombre del servicio, no localhost
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM}
      RECUPERACION_DEV_JSON: ${RECUPERACION_DEV_JSON}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend-network

  mailpit:
    image: axllent/mailpit:latest   # TODO: fijar una versión concreta
    container_name: centro_gamer_mailpit
    restart: always
    # El SMTP (1025) no se publica al host: solo lo usa la API dentro de la red
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: centro_gamer_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    depends_on:
      - postgres_db
    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge